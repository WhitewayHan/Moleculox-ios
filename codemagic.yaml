workflows:
  moleculox-ios-app-store:
    name: Moleculox iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Moleculox
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.whitewayhan.moleculox
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Python icon library
        script: pip3 install --user Pillow
      - name: Validate game JavaScript
        script: npm run check
      - name: Generate and prepare iOS project
        script: npm run ios:prepare
      - name: Fix Firebase configuration crash
        script: |
          python3 - <<'PYEOF'
          path = "ios/App/App/AppDelegate.swift"
          with open(path) as f:
              s = f.read()
          if "FirebaseOptions(" not in s:
              needle = 'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
              init_code = '''
                  if FirebaseApp.app() == nil {
                      let fbOptions = FirebaseOptions(googleAppID: "1:638154711182:ios:854a506583df0945ff69df", gcmSenderID: "638154711182")
                      fbOptions.apiKey = "AIzaSyBYZT6PJPsABWzHgZhc7em3o7yrZoFvl1o"
                      fbOptions.projectID = "moleculox-2f4b4"
                      fbOptions.bundleID = "com.whitewayhan.moleculox"
                      fbOptions.clientID = "638154711182-7iqh4hdleuulgchvq4o3ibaph5fic88h.apps.googleusercontent.com"
                      fbOptions.storageBucket = "moleculox-2f4b4.firebasestorage.app"
                      FirebaseApp.configure(options: fbOptions)
                  }'''
              if "FirebaseApp.configure()" in s:
                  s = s.replace("if FirebaseApp.app() == nil { FirebaseApp.configure() }", init_code.strip())
              elif needle in s:
                  s = s.replace(needle, needle + init_code)
              else:
                  raise SystemExit("Could not find didFinishLaunchingWithOptions in AppDelegate.swift")
          with open(path, "w") as f:
              f.write(s)
          print("AppDelegate.swift patched with explicit Firebase configuration.")
          PYEOF
      - name: Set iOS versions
        script: |
          BUILD_NUMBER="$(date +%s)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.0.0" ios/App/App/Info.plist
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true