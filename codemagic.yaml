workflows:
  moleculox-ios-app-store:
    name: Moleculox R77 v8.7.19 iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Moleculox
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.whitewayhan.moleculox
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Python icon library
        script: pip3 install --user Pillow
      - name: Validate game JavaScript
        script: |
          npm run check
          grep -Fq 'const APP_VERSION="v8.7.19";' www/js/game.js
          grep -Fq 'async function nativeGoogleSignIn(button)' www/js/game.js
          grep -Fq 'async function nativeAppleSignIn(button)' www/js/game.js
          grep -Fq 'const MX_SHOW_APPLE_BTN=MX_IOS_NATIVE&&MX_APPLE_NATIVE_READY;' www/js/game.js
          grep -Fq 'connectGoogleIdToken(idToken)' www/js/game.js
          grep -Fq 'connectAppleIdToken(idToken,verifiedRawNonce' www/js/game.js
          grep -Fq '"apple.com"' capacitor.config.json
          grep -Fq '"google.com"' capacitor.config.json
          grep -Fq 'FirebaseAppCheck' www/js/firebase.js
          grep -Fq '"@capacitor-firebase/app-check": "7.3.1"' package.json
          test -d node_modules/@capacitor-firebase/app-check
      - name: Generate and prepare iOS project
        script: npm run ios:prepare
      - name: Verify generated App Store icon
        script: python3 scripts/verify-app-icon.py
      - name: Verify iPhone-only target
        script: python3 scripts/verify-iphone-only.py
      - name: Set iOS versions
        script: |
          BUILD_NUMBER="$(date +%s)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.7.19" ios/App/App/Info.plist
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Verify built IPA is iPhone-only
        script: python3 scripts/verify-built-ipa.py
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
