workflows:
  moleculox-ios-app-store:
    name: Moleculox R371 v8.7.203 iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Moleculox
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.whitewayhan.moleculox
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore R371 web bundle
        script: bash scripts/restore-www.sh
      - name: Install dependencies
        script: npm install
      - name: Install Python icon library
        script: pip3 install --user Pillow
      - name: Validate R371 iOS source
        script: npm run check
      - name: Generate and prepare iOS project
        script: npm run ios:prepare
      - name: Verify generated App Store icon
        script: python3 scripts/verify-app-icon.py
      - name: Verify iPhone-only target
        script: python3 scripts/verify-iphone-only.py
      - name: Set iOS versions
        script: |
          BUILD_NUMBER="$(date +%s)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.7.203" ios/App/App/Info.plist
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
      - name: Verify built IPA release metadata
        script: python3 scripts/verify-built-ipa.py
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
